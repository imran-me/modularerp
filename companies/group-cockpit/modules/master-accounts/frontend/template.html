<!-- ============================================================================
  MASTER ACCOUNTS · MARKUP
  ----------------------------------------------------------------------------
  Static shells only, separated from the logic (frontend/master-accounts.js) and
  cloned + filled via [data-tpl] / [data-slot]. The group accounting desk is
  highly dynamic — the company switcher, the expense/journal/schedule/payroll/
  bank desks, VAT & AIT return, opening-balance posters and every table/modal/
  form keep their legacy el()-built DOM (with inline styles) in the logic file,
  exactly as before. Only the reusable page / section-nav / KPI shells live here,
  in house design-system classes verbatim (no Tailwind tw- utilities).

  Each fragment is ONE line, no inter-tag whitespace — a clone is byte-for-byte
  the DOM the old ui.el() calls produced.
  ============================================================================ -->

<!-- page shell + section-nav band (this module uses the DENSE underline band, 9 sections) -->
<template data-tpl="page"><div class="page"></div></template>
<template data-tpl="nav"><div class="tab-underline tabs-dense mb-3"></div></template>
<template data-tpl="nav-btn"><button></button></template>

<!-- KPI grid (compact, one row) + one KPI card -->
<template data-tpl="kpi-grid"><div class="kpi-grid kpi-compact stagger"></div></template>
<template data-tpl="kpi"><div class="kpi-card"><div class="kpi-top"><span class="kpi-label" data-slot="label"></span><span class="kpi-ico" data-slot="ico"></span></div><div class="kpi-value" data-slot="value"></div></div></template>

<!-- reusable shells (markup, filled by the logic) --------------------------- -->
<!-- a titled card: head (title + optional sub) over a body slot -->
<template data-tpl="titled-card"><div class="card"><div class="card-head"><h3 data-slot="title"></h3><span class="card-sub" data-slot="sub"></span></div><div class="card-body" data-slot="body"></div></div></template>
<!-- a primary action button on its own row (fill data-slot="btn") -->
<template data-tpl="add-row"><div class="mb-2"><button class="btn btn-sm btn-primary" data-slot="btn"></button></div></template>
<!-- a bare button (class + html + onclick set by the logic) -->
<template data-tpl="btn"><button class="btn"></button></template>
<!-- a link styled as a button (class + href + html set by the logic) -->
<template data-tpl="a-btn"><a class="btn"></a></template>
<!-- a wrapping flex row for a button strip -->
<template data-tpl="btn-strip"><div class="flex gap-1 flex-wrap mb-2"></div></template>
<!-- a scrollable simple ledger table (modal) + one row -->
<template data-tpl="ledger-table"><div class="table-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Ref</th><th>Memo</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead><tbody data-slot="rows"></tbody></table></div></template>
<template data-tpl="ledger-row"><tr><td data-slot="date"></td><td data-slot="ref"></td><td data-slot="memo"></td><td class="num" data-slot="debit"></td><td class="num" data-slot="credit"></td><td class="num" data-slot="balance"></td></tr></template>
<!-- schedule section card: head has a right-aligned running total (tone set by logic) -->
<template data-tpl="sched-card"><div class="card mb-2"><div class="card-head"><h3 data-slot="title"></h3><span class="strong num" style="margin-left:auto" data-slot="total"></span></div><div class="card-body" data-slot="body"></div></div></template>
<!-- a plain card = just a body (no head), for guards/notes -->
<template data-tpl="body-card"><div class="card"><div class="card-body" data-slot="body"></div></div></template>
<!-- VAT/AIT return: month input, the period row, one tax row -->
<template data-tpl="month-input"><input class="input" type="month" style="width:auto"></template>
<template data-tpl="tax-period-row"><div class="flex gap-2 items-center mb-2"><span class="text-mute sm">Return period</span><span data-slot="input"></span><span class="text-mute xs">collected via the Credit/Debit journal tax fields · deposit clears the payable</span></div></template>
<template data-tpl="tax-row"><div class="data-row"><div class="flex-1"><div class="fw-600 sm" data-slot="head"></div><div class="text-mute xs" data-slot="detail"></div></div><div class="num strong" data-slot="payable"></div></div></template>

<!-- a plain section label -->
<template data-tpl="section-label"><div class="section-label"></div></template>
<!-- bank overview: the card grid, an inline detail host, an empty note, and ONE premium bank card -->
<template data-tpl="bank-grid"><div class="grid-auto stagger bank-acct-grid"></div></template>
<template data-tpl="bank-detail-host"><div class="mt-3"></div></template>
<template data-tpl="pad-note"><div class="card"><div class="card-pad text-mute" data-slot="body"></div></div></template>
<template data-tpl="bank-card"><div class="card bank-card" style="cursor:pointer"><div class="bank-card-top"><div class="bank-card-ico" data-slot="ico"><i data-slot="glyph"></i><span class="bank-card-coico" data-slot="coico"><i data-slot="coicon"></i></span></div><div class="bank-card-id"><div class="bank-card-name" data-slot="name"></div><div class="bank-card-sub" data-slot="sub"></div></div><span class="bank-card-status" data-slot="status"></span><div class="bank-card-actions" data-slot="actions"></div></div><div class="bank-card-hero"><div class="bank-card-caprow"><span class="bank-card-caplabel" data-slot="caplabel"></span><span class="bank-card-delta" data-slot="delta"></span></div><div class="bank-card-bal" data-slot="bal"></div><div class="bank-card-acct" data-slot="acct"></div></div><div class="bank-card-foot"><div class="bank-card-metric"><span class="k">Opening</span><div class="v" data-slot="opening"></div></div><div class="bank-card-metric right"><span class="k">Activity</span><div class="v" data-slot="activity"></div></div></div></div></template>
